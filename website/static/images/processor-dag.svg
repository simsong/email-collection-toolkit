<title id="title">Ingest, message, and content processing</title>
<desc id="desc">ClamAV scans before filing. Filing queues message processing, which stores metadata and queues MIME content processing. MIME extraction feeds text/plain directly and HTML or RTF conversion above it. Discovered child messages return to message processing without another antivirus scan.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M1 1 L8 4.5 L1 8" fill="none" stroke="#486078" stroke-width="1.4"/></marker><marker id="return" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M1 1 L8 4.5 L1 8" fill="none" stroke="#97631b" stroke-width="1.4"/></marker>
<style>text{font-family:Arial,sans-serif;fill:#20354a;font-size:18px}.title{font-size:30px;font-weight:bold}.heading{font-size:23px;font-weight:bold}.small{font-size:16px;fill:#486078}.box{fill:white;stroke:#9aabba;stroke-width:1.5;rx:10}.flow{fill:none;stroke:#486078;stroke-width:2;marker-end:url(#arrow)}.return{fill:none;stroke:#97631b;stroke-width:2.5;marker-end:url(#return)}.note{fill:#fff5df;stroke:#b69252;stroke-width:1.5;rx:10}</style></defs>
<rect width="1500" height="1100" fill="white"/>
<text x="40" y="48" class="title">Ingest, message, and content processing</text>
<text x="40" y="80" class="small">Proposed plugin architecture · not yet implemented</text>
<rect x="40" y="110" width="1420" height="74" class="box"/>
<text x="56" y="140" class="">Source / container acquisition → original messages and provenance</text>
<text x="56" y="166" class="small">Source plugins → file-parser plugins (MBOX, EML, EMLX, Babyl, …) → ingest handoff</text>
<rect x="30" y="240" width="425" height="650" rx="16" fill="#eff7f2"/>
<text x="52" y="278" class="heading">1 · Ingest</text>
<rect x="530" y="240" width="410" height="650" rx="16" fill="#eef4fb"/>
<text x="552" y="278" class="heading">2 · Message processing</text>
<rect x="1010" y="240" width="460" height="650" rx="16" fill="#f7f1fb"/>
<text x="1032" y="278" class="heading">3 · Content processing</text>
<rect x="60" y="320" width="355" height="74" class="box"/>
<text x="76" y="350" class="">ClamAV · rank 1</text>
<text x="76" y="376" class="small">Scan the entire raw message</text>
<path d="M237 184 V320" class="flow"/>
<rect x="60" y="470" width="355" height="98" class="box"/>
<text x="76" y="500" class="">Filing / handoff · rank 2</text>
<text x="76" y="526" class="small">Standard deduplication</text>
<text x="76" y="550" class="small">Write mailbox + queue pipeline 2</text>
<path d="M237 394 V470" class="flow"/>
<text x="252" y="435" class="small">continue</text>
<rect x="60" y="680" width="355" height="98" class="note"/>
<text x="76" y="710" class="">INFECTED.mbox</text>
<text x="76" y="736" class="small">Preserve original bytes</text>
<text x="76" y="760" class="small">Record outcome; stop this message</text>
<path d="M415 355 H440 V720 H415" class="flow"/>
<text x="65" y="828" class="small">All plugins can access all headers</text>
<text x="65" y="852" class="small">and all content of their message.</text>
<rect x="550" y="320" width="370" height="74" class="box"/>
<text x="566" y="350" class="">Header / metadata extraction</text>
<text x="566" y="376" class="small">Store message metadata in SQLite</text>
<path d="M415 519 H480 V357 H550" class="flow"/>
<rect x="550" y="470" width="370" height="74" class="box"/>
<text x="566" y="500" class="">Other message subscribers</text>
<text x="566" y="526" class="small">Honor declared dependencies</text>
<path d="M735 394 V470" class="flow"/>
<rect x="550" y="620" width="370" height="74" class="box"/>
<text x="566" y="650" class="">Content handoff</text>
<text x="566" y="676" class="small">Durably queue content processing</text>
<path d="M735 544 V620" class="flow"/>
<rect x="1030" y="320" width="410" height="74" class="box"/>
<text x="1046" y="350" class="">MIME extractor</text>
<text x="1046" y="376" class="small">Emit typed body / attachment content</text>
<path d="M920 657 H975 V357 H1030" class="flow"/>
<rect x="1130" y="440" width="280" height="98" class="box"/>
<text x="1146" y="470" class="">HTML / RTF</text>
<text x="1146" y="496" class="small">Body text fallback</text>
<text x="1146" y="520" class="small">Prefer HTML over RTF</text>
<path d="M1270 394 V440" class="flow"/>
<rect x="1130" y="590" width="280" height="74" class="box"/>
<text x="1146" y="620" class="">text/plain</text>
<text x="1146" y="646" class="small">Identity evidence / indexing</text>
<path d="M1270 538 V590" class="flow"/>
<path d="M1055 394 V627 H1130" class="flow"/>
<text x="1067" y="568" class="small">direct</text>
<rect x="1030" y="710" width="410" height="74" class="box"/>
<text x="1046" y="740" class="">Other MIME subscribers</text>
<text x="1046" y="766" class="small">Process other content and attachments</text>
<path d="M1440 357 H1455 V747 H1440" class="flow"/>
<rect x="1030" y="820" width="410" height="50" class="note"/>
<text x="1046" y="850" class="">Discovered child message</text>
<path d="M1235 784 V820" class="flow"/>
<path d="M1030 845 H990 V930 H505 V215 H735 V320" class="return"/>
<text x="550" y="918" class="small">New child job → message processing; no antivirus rescan</text>
<text x="553" y="795" class="small">Child: parent path + attachment tag</text>
<text x="553" y="821" class="small">Retain parent scan provenance</text>
<text x="553" y="847" class="small">Apply standard deduplication</text>
<rect x="40" y="975" width="1420" height="98" class="box"/>
<text x="56" y="1005" class="">Shared services and execution rules</text>
<text x="56" y="1031" class="small">Ranks and dependencies • part / message / import abort • scanner timeout: 60 seconds by default</text>
<text x="56" y="1055" class="small">Durable checkpoints • per-plugin timing statistics • synthetic text is processing-only, never canonical mail</text>
</svg>
