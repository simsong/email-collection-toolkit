{% extends "base.html" %}
{% block title %}{{ config.title }}{% endblock title %}
{% block content %}
{% set releases = load_data(path="data/releases.toml") %}
<main>
  <section class="hero-wrap">
    <div class="rainbow-flow" aria-hidden="true"></div>
    <div class="hero shell">
      <div class="hero-copy">
        <p class="eyebrow">Collect · Preserve · Search · Understand</p>
        <h1>Email Collection Toolkit</h1>
        <p class="lede">A modern, open-source toolkit for making email a lasting part of the historical record.</p>
        <div class="actions">
          <a class="button primary" href="{{ get_url(path='use-cases/') }}">Get started <span aria-hidden="true">→</span></a>
          <a class="button secondary" href="{{ config.extra.repository }}">View on GitHub</a>
        </div>
      </div>
      <div class="hero-message">
        <p>Email has<br>a history.<br><strong>Keep it.</strong></p>
      </div>
    </div>
  </section>

  <section class="capabilities shell" aria-label="Core capabilities">
    <article><span class="cap-icon">⇩</span><h2>Collect</h2><p>Import from many sources and old backups.</p></article>
    <article><span class="cap-icon">◇</span><h2>Preserve</h2><p>Standards-based archives with BagIt and Mailbag.</p></article>
    <article><span class="cap-icon">⌕</span><h2>Search</h2><p>Fast full-text search, with semantic search planned.</p></article>
    <article><span class="cap-icon">▤</span><h2>Understand</h2><p>Finding aids, provenance, reports, and context.</p></article>
  </section>

  <section class="story-grid shell">
    <article class="story-card">
      <div class="story-copy">
        <p class="eyebrow">Collections are evidence</p>
        <h2>Email tells a story.</h2>
        <p>Whether it is your own inbox or the papers of someone you admire, Email Collection Toolkit helps keep those stories safe, searchable, and meaningful.</p>
        <a class="text-link" href="{{ get_url(path='use-cases/') }}">See how it works <span aria-hidden="true">→</span></a>
      </div>
      <div class="typing-art" role="img" aria-label="Hands typing at a keyboard">
        <div class="keyboard">
          <span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span>
          <span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span>
          <span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span>
        </div>
        <div class="hand hand-left"></div><div class="hand hand-right"></div>
      </div>
    </article>

    <article class="insight-card">
      <p class="eyebrow">From inbox to insight</p>
      <h2>Preservation-ready by design.</h2>
      <p>Turn scattered mailboxes into a collection with strong provenance and open formats.</p>
      <ul>
        <li>Supported MBOX, Maildir, EML, Apple Mail, and Babyl today</li>
        <li>Native BagIt / Mailbag packaging</li>
        <li>SHA-256 integrity and source tracking</li>
        <li>Local FTS5 search with rebuildable indexes</li>
        <li>Archivist-friendly workflows and ePADD interoperability</li>
      </ul>
      <a class="text-link" href="{{ get_url(path='curation/') }}">Explore features <span aria-hidden="true">→</span></a>
    </article>
  </section>

  <section class="release-card shell" aria-labelledby="release-title">
    <div>
      <p class="eyebrow">Project status</p>
      <h2 id="release-title">Open source and under active development.</h2>
      <p>Current release: <a href="{{ releases.current_url }}">{{ releases.current_version }}</a></p>
    </div>
    <div class="release-links">
      <a href="{{ releases.stable.url }}"><span>Stable</span><strong>{{ releases.stable.version }}</strong></a>
      <a href="{{ releases.beta.url }}"><span>Beta</span><strong>{{ releases.beta.version }}</strong></a>
    </div>
  </section>

  <section class="resource-grid shell" aria-labelledby="resources-title">
    <div class="section-heading"><p class="eyebrow">Documentation</p><h2 id="resources-title">Go deeper.</h2></div>
    <a class="resource-card" href="{{ get_url(path='curation/') }}"><span>↗</span><h3>Curation</h3><p>Formats, preservation, reports, and related archival resources.</p></a>
    <a class="resource-card" href="{{ get_url(path='discussions/') }}"><span>↗</span><h3>Community</h3><p>Announcements, feature requests, and project discussion.</p></a>
    <a class="resource-card" href="{{ config.extra.release_notes }}"><span>↗</span><h3>Release notes</h3><p>Changes included in current and previous releases.</p></a>
  </section>
</main>
{% endblock content %}
