<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-eval'; style-src 'self'; object-src 'none'; connect-src 'self'">
    <title>Email Collection Toolkit — Ingests</title>
    <link rel="stylesheet" href="ingests.css">
  </head>
  <body>
    <div id="antivirus-warning" role="alert" hidden><span id="antivirus-detail"></span> <button id="install-antivirus" type="button">Install ClamAV…</button></div>
    <main class="ingest-browser">
      <aside class="ingest-history">
        <header><h1>Ingests</h1><span id="history-count"></span></header>
        <div class="ingest-actions"><button id="import-directory" type="button" disabled>Import Directory…</button>
          <button id="suspend-import" type="button" disabled>Suspend Import</button>
          <button id="resume-import" type="button" disabled>Continue Import</button>
          <button id="update-imap-password" type="button" hidden>Update IMAP Password…</button>
          <p id="import-control-status" role="status" hidden></p></div>
        <div id="starting-import" role="status" hidden><span class="state-dot running" aria-hidden="true">✓</span><span>Starting — preparing archive…</span></div>
        <div id="history-list" role="listbox" aria-label="Ingest history"></div>
        <div id="history-errors" class="history-errors" hidden></div>
      </aside>
      <article id="ingest-detail" class="ingest-detail">
        <p class="empty">No ingest history is available for this archive.</p>
      </article>
    </main>
    <dialog id="imap-password-dialog">
      <form id="imap-password-form">
        <h2>Update IMAP Password</h2>
        <p>Test the replacement before saving it in the OS credential store. No mail is downloaded.</p>
        <label for="imap-account">Account</label><select id="imap-account"></select>
        <label for="imap-password">New password or app password</label>
        <input id="imap-password" type="password" autocomplete="new-password" required>
        <p id="imap-password-status" role="status"></p>
        <button id="save-imap-password" type="submit">Test and Save</button>
        <button id="cancel-imap-password" type="button">Cancel</button>
      </form>
    </dialog>
    <div id="error" role="alert" hidden></div>
    <script src="rust-panel.js"></script>
    <script src="coordination.js"></script>
    <script src="ingests.js"></script>
  </body>
</html>
