# Provide the same Rust build and validation commands on every host platform.
# Aliases select supported workspace validation and MSIX assembly.
# The small xtask runner orders format, Clippy and tests without a POSIX shell.
# Cargo retains ownership of dependency resolution and incremental builds.
# The macOS Makefile delegates to these same commands.
[alias]
msix-test = "run --locked -p xtask -- msix-test"
workspace-check = "run --locked -p xtask -- check workspace"
