name: Build and deploy website

on:
  push:
    branches: [main]
    paths:
      - "website/**"
      - "scripts/update_site_releases.py"
      - ".github/workflows/pages.yml"
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Install Zola
        env:
          ZOLA_VERSION: 0.23.4
          ZOLA_SHA256_ARM64: 303b8e1f3251a6250e47f811eda143316f653c22201faa66777d48ac499c0ee3
          ZOLA_SHA256_X86_64: e79edcba2e8d03d22065c9cb8fa2e3abf07b823ef17f00abdc060188dceabba7
        run: |
          case "$(uname -m)" in
            arm64) zola_arch=aarch64; zola_sha256="$ZOLA_SHA256_ARM64" ;;
            x86_64) zola_arch=x86_64; zola_sha256="$ZOLA_SHA256_X86_64" ;;
            *) echo 'Unsupported macOS architecture'; exit 1 ;;
          esac
          curl --fail --location --output "$RUNNER_TEMP/zola.tar.gz" \
            "https://github.com/getzola/zola/releases/download/v${ZOLA_VERSION}/zola-v${ZOLA_VERSION}-${zola_arch}-apple-darwin.tar.gz"
          printf '%s  %s\n' "$zola_sha256" "$RUNNER_TEMP/zola.tar.gz" | shasum -a 256 --check -
          mkdir "$RUNNER_TEMP/zola"
          tar -xzf "$RUNNER_TEMP/zola.tar.gz" -C "$RUNNER_TEMP/zola"
          echo "$RUNNER_TEMP/zola" >> "$GITHUB_PATH"
      - name: Resolve release links
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --paginate "repos/${GITHUB_REPOSITORY}/git/refs/tags?per_page=100" \
            --jq '.[] | .ref | ltrimstr("refs/tags/")' \
            | python3 scripts/update_site_releases.py --output website/data/releases.toml
      - name: Build Zola site
        run: zola --root website build --output-dir "$RUNNER_TEMP/mail-archiver-site"
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ${{ runner.temp }}/mail-archiver-site

  deploy:
    needs: build
    runs-on: macos-15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
