name: Build and deploy website

on:
  push:
    branches: [main]
  workflow_call:
    inputs:
      release_tag:
        description: Published tag whose appcast was produced by the calling release run.
        type: string
        default: ""

permissions:
  actions: read
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  queue: max

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Install Zola
        env:
          ZOLA_VERSION: 0.23.4
          ZOLA_SHA256_ARM64: 303b8e1f3251a6250e47f811eda143316f653c22201faa66777d48ac499c0ee3
          ZOLA_SHA256_X86_64: e79edcba2e8d03d22065c9cb8fa2e3abf07b823ef17f00abdc060188dceabba7
        run: |
          case "$(uname -m)" in
            arm64) zola_arch=aarch64; zola_sha256="$ZOLA_SHA256_ARM64" ;;
            x86_64) zola_arch=x86_64; zola_sha256="$ZOLA_SHA256_X86_64" ;;
            *) echo 'Unsupported macOS architecture'; exit 1 ;;
          esac
          curl --fail --location --output "$RUNNER_TEMP/zola.tar.gz" \
            "https://github.com/getzola/zola/releases/download/v${ZOLA_VERSION}/zola-v${ZOLA_VERSION}-${zola_arch}-apple-darwin.tar.gz"
          printf '%s  %s\n' "$zola_sha256" "$RUNNER_TEMP/zola.tar.gz" | shasum -a 256 --check -
          mkdir "$RUNNER_TEMP/zola"
          tar -xzf "$RUNNER_TEMP/zola.tar.gz" -C "$RUNNER_TEMP/zola"
          echo "$RUNNER_TEMP/zola" >> "$GITHUB_PATH"
      - name: Resolve release links
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          {
            gh api --paginate "repos/${GITHUB_REPOSITORY}/releases?per_page=100" \
              --jq '.[] | select(.draft == false) | .tag_name'
            if [[ -n "$RELEASE_TAG" ]]; then printf '%s\n' "$RELEASE_TAG"; fi
          } | python3 scripts/update_site_releases.py --output website/data/releases.toml
      - name: Include latest published Sparkle appcast
        if: ${{ inputs.release_tag == '' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          appcast_tag="$(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
            --jq '[.[] | select(.draft == false)][0].tag_name // empty')"
          if [[ -z "$appcast_tag" ]]; then
            echo "No published release appcast is available; refusing to deploy the seed feed" >&2
            exit 1
          fi
          for attempt in 1 2 3 4 5 6; do
            if gh release download "$appcast_tag" --repo "$GITHUB_REPOSITORY" \
              --pattern appcast.xml --output "$RUNNER_TEMP/latest-appcast.xml" --clobber; then
              break
            fi
            if [[ "$attempt" -eq 6 ]]; then exit 1; fi
            sleep "$attempt"
          done
          make check-appcast APPCAST="$RUNNER_TEMP/latest-appcast.xml" RELEASE_TAG="$appcast_tag"
          cp "$RUNNER_TEMP/latest-appcast.xml" website/static/updates/mac/appcast.xml
      - name: Include this release's signed appcast
        if: ${{ inputs.release_tag != '' }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-appcast
          path: website/static/updates/mac
      - name: Validate deployed appcast
        if: ${{ inputs.release_tag != '' }}
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: make check-appcast APPCAST=website/static/updates/mac/appcast.xml RELEASE_TAG="$RELEASE_TAG"
      - name: Build Zola site
        run: zola --root website build --output-dir "$RUNNER_TEMP/mail-archiver-site"
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ${{ runner.temp }}/mail-archiver-site

  deploy:
    needs: build
    runs-on: macos-15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
