# Build each native payload once, then share one bundle between install-test VMs.
# Explicit dispatch and reusable calls keep Windows packaging out of ordinary CI.
# Test keys stay in assembly; production uses protected-environment Azure OIDC.
# Installation jobs consume the same artifact without checkout toolchains or rebuilds.
# Public releases require timestamped trust; the upgrade fixture never ships.
name: Python webview MSIX installation tests
on:
  push:
    branches: [codex/windows-msix-ci]
  workflow_dispatch:
    inputs:
      public_signing:
        description: Use Microsoft public-trust signing
        type: boolean
        default: false
  workflow_call:
    inputs:
      public_signing:
        type: boolean
        default: false
    secrets:
      MSIX_TEST_CERT_PFX_BASE64:
        required: false
permissions:
  contents: read
jobs:
  payload:
    if: github.event_name != 'push' || github.ref_type == 'tag' || contains(github.event.head_commit.message, '[msix-ci]') || contains(github.event.head_commit.message, '[release-ci]')
    name: Build payload (${{ matrix.arch }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            arch: x64
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      - name: Install Make and x64 Python dependencies
        run: |
          choco install make --yes --no-progress
          uv sync --locked --python cpython-3.12-windows-x86_64-none
      - name: Validate reader and build Python payload
        env:
          PUBLIC_SIGNING: ${{ inputs.public_signing }}
          MSIX_PUBLISHER: ${{ vars.MSIX_PUBLISHER }}
        run: |
          $env:PATH = "C:/Program Files/Git/usr/bin;" + $env:PATH
          make MAKE=make 'SHELL=C:/Program Files/Git/usr/bin/bash.exe' prepare-windows-clamav prepare-windows-updater freshclam test-windows-scanner test-windows-updater test-definition-state
          if ($LASTEXITCODE) { throw 'Windows antivirus preparation or acceptance failed' }
          make MAKE=make 'SHELL=C:/Program Files/Git/usr/bin/bash.exe' check-python-reader-static test-python-reader test-windows-package-entry test-python-writer test-python-reader-native 'ARGS=--output dist/native-reader'
          if ($LASTEXITCODE) { throw 'Reader checks failed' }
          $arguments = '-CreateUpgradeTest'
          if ($env:PUBLIC_SIGNING -eq 'true') {
            if ([string]::IsNullOrWhiteSpace($env:MSIX_PUBLISHER) -or $env:MSIX_PUBLISHER -eq 'CN=ECT Local Test') { throw 'Configure the approved MSIX_PUBLISHER repository variable.' }
            $arguments += ' -Publisher "' + $env:MSIX_PUBLISHER + '" -PublisherDisplayName "Simson L. Garfinkel"'
          }
          make 'SHELL=C:/Program Files/Git/usr/bin/bash.exe' msix-test "MSIX_ARGS=$arguments"
          if ($LASTEXITCODE) { throw 'MSIX assembly failed' }
          $package = (Get-ChildItem dist/windows-msix-test/*.msix).FullName
          make 'SHELL=C:/Program Files/Git/usr/bin/bash.exe' test-msix "MSIX_PACKAGE=$package" 'MSIX_EVIDENCE=dist/relocated'
          if ($LASTEXITCODE) { throw 'Relocated MSIX failed' }
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: msix-payload-${{ matrix.arch }}
          path: |
            dist/windows-msix-test/*.msix
            dist/windows-msix-test/upgrade/*.msix
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: msix-build-logs-${{ matrix.arch }}
          path: |
            dist/windows-msix-test/*.log
            dist/native-reader/*.log
            dist/native-reader/*.json
            dist/native-reader/reader.png
            dist/relocated/*.log
            dist/relocated/reader/*.json
            dist/relocated/reader/reader.png
          retention-days: 7
  bundle:
    needs: payload
    environment: ${{ inputs.public_signing && 'windows-signing' || 'windows-test-signing' }}
    permissions:
      contents: read
      id-token: write
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: msix-payload-x64
          path: dist/payloads/x64
      - name: Assemble and test-sign shared bundles
        if: ${{ !inputs.public_signing }}
        env:
          MSIX_TEST_CERT_PFX_BASE64: ${{ secrets.MSIX_TEST_CERT_PFX_BASE64 }}
        shell: pwsh
        run: ./scripts/win/bundle_test_msix.ps1 -InputDirectory dist/payloads
      - name: Check Microsoft signing configuration
        if: inputs.public_signing
        shell: pwsh
        env:
          AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
          AZURE_SIGNING_ENDPOINT: ${{ vars.AZURE_SIGNING_ENDPOINT }}
          AZURE_SIGNING_ACCOUNT: ${{ vars.AZURE_SIGNING_ACCOUNT }}
          AZURE_SIGNING_PROFILE: ${{ vars.AZURE_SIGNING_PROFILE }}
          MSIX_PUBLISHER: ${{ vars.MSIX_PUBLISHER }}
        run: |
          foreach ($name in @('AZURE_CLIENT_ID','AZURE_TENANT_ID','AZURE_SUBSCRIPTION_ID','AZURE_SIGNING_ENDPOINT','AZURE_SIGNING_ACCOUNT','AZURE_SIGNING_PROFILE','MSIX_PUBLISHER')) {
            if ([string]::IsNullOrWhiteSpace([Environment]::GetEnvironmentVariable($name))) { throw "Missing signing configuration: $name" }
          }
      - name: Assemble unsigned public bundles
        if: inputs.public_signing
        shell: pwsh
        run: ./scripts/win/bundle_test_msix.ps1 -InputDirectory dist/payloads -PublicSigning
      - name: Authenticate to Azure with GitHub OIDC
        if: inputs.public_signing
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Sign and timestamp both public bundles
        if: inputs.public_signing
        uses: azure/artifact-signing-action@c7ab2a863ab5f9a846ddb8265964877ef296ee82 # v2
        with:
          endpoint: ${{ vars.AZURE_SIGNING_ENDPOINT }}
          signing-account-name: ${{ vars.AZURE_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ vars.AZURE_SIGNING_PROFILE }}
          files-folder: ${{ github.workspace }}/dist/bundle
          files-folder-filter: msixbundle
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
          cache-dependencies: false
          exclude-environment-credential: true
          exclude-workload-identity-credential: true
          exclude-managed-identity-credential: true
          exclude-shared-token-cache-credential: true
          exclude-visual-studio-credential: true
          exclude-visual-studio-code-credential: true
          exclude-azure-cli-credential: false
          exclude-azure-powershell-credential: true
          exclude-azure-developer-cli-credential: true
          exclude-interactive-browser-credential: true
      - name: Verify public signatures, timestamps and publisher
        if: inputs.public_signing
        shell: pwsh
        env:
          MSIX_PUBLISHER: ${{ vars.MSIX_PUBLISHER }}
        run: ./scripts/win/verify_public_msix.ps1 -Publisher $env:MSIX_PUBLISHER
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-msix-install-test
          path: |
            dist/bundle/base.msixbundle
            dist/bundle/*.cer
            dist/bundle/signing-verification.json
            dist/bundle/sha256.json
            dist/bundle/README.txt
            dist/bundle/Install-Test-Certificate.ps1
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ci-only-msix-upgrade-fixture
          path: dist/bundle/upgrade.msixbundle
          if-no-files-found: error
          retention-days: 7
  install:
    name: Install same bundle (${{ matrix.arch }})
    needs: bundle
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            arch: x64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: windows-msix-install-test
          path: dist/bundle
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ci-only-msix-upgrade-fixture
          path: dist/bundle
      - name: Install, launch, upgrade and uninstall
        shell: powershell
        env:
          PUBLIC_SIGNING: ${{ inputs.public_signing }}
        run: |
          ./scripts/win/test_installed_msix.ps1 -BundleDirectory dist/bundle -Architecture ${{ matrix.arch }} -PublicSigning:($env:PUBLIC_SIGNING -eq 'true')
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: msix-installed-evidence-${{ matrix.arch }}
          path: |
            dist/installed-evidence/install.log
            dist/installed-evidence/*/report.json
            dist/installed-evidence/*-window.txt
            dist/installed-evidence/success.txt
          if-no-files-found: error
          retention-days: 7
