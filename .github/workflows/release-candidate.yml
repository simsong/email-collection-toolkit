# Exercise release gates on a branch before its immutable version tag is pushed.
# Reuse the actual Makefile macOS gates and shared Windows installation workflow.
# Authenticate prior history, both final installers and the complete candidate XML.
# This workflow retains public candidate artifacts but never creates a release.
# Production publication still requires the tag workflow's identity preflight.
name: Validate release candidate
on:
  workflow_call:
permissions:
  contents: read
jobs:
  windows:
    uses: ./.github/workflows/windows-msix.yml
    secrets: inherit
  macos:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      - name: Prepare native dependencies
        run: |
          uv sync --locked --all-groups
          rustup toolchain install stable --profile minimal
          brew install clamav
          make freshclam
      - name: Validate signer and packaging policy
        run: make test-signing test-sparkle-signing
      - name: Build, notarize and execute actual candidate
        env:
          RUSTUP_TOOLCHAIN: stable
          APPLE_CERTIFICATE_P12_BASE64: ${{ secrets.APPLE_CERTIFICATE_P12_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          APPLE_NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
          APPLE_NOTARY_PRIVATE_KEY_BASE64: ${{ secrets.APPLE_NOTARY_PRIVATE_KEY_BASE64 }}
        run: make release-package-check
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: macos-dmg
          path: dist/*.dmg
          if-no-files-found: error
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: macos-packaging-reports
          path: dist/*.json
          if-no-files-found: ignore
  signatures:
    needs: [macos, windows]
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: macos-dmg
          path: dist
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: windows-msix-install-test
          path: dist/windows
      - name: Stage only tested release files
        run: make release-files sparkle-tools
      - name: Authenticate previous published feed
        env:
          GH_TOKEN: ${{ github.token }}
        run: make release-candidate-base APPCAST="$RUNNER_TEMP/appcast.xml"
      - name: Sign and verify both installers and complete XML
        env:
          SPARKLE_ED25519_PRIVATE_KEY_BASE64: ${{ secrets.SPARKLE_ED25519_PRIVATE_KEY_BASE64 }}
        run: make release-candidate-feed APPCAST="$RUNNER_TEMP/appcast.xml"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: verified-candidate-appcast
          path: ${{ runner.temp }}/appcast.xml
          if-no-files-found: error
