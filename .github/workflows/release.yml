name: Assemble GitHub release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing annotated tag, for example v1.2.3.
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-appcast
  cancel-in-progress: false

jobs:
  assemble:
    name: Assemble macOS release
    needs: macos
    runs-on: macos-15
    permissions:
      actions: write
      contents: write
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.macos.outputs.commit }}
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.12"
      - name: Set up uv
        uses: astral-sh/setup-uv@v10.0.1
      - name: Verify release commit
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          git check-ref-format "refs/tags/$RELEASE_TAG"
          test "$(git rev-parse HEAD)" = "$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")"
      - name: Verify annotated tag and project version
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: make release-tag-check GITHUB_REF_NAME="$RELEASE_TAG" ARGS=--require-annotated
      - name: Install dependencies
        run: uv sync --locked --all-groups
      - name: Validate distributions
        run: make distribution-check
      # make ruff uses uv run --locked, which syncs the default dev group
      # (including Ruff) even when the runner has no project virtualenv yet.
      - name: Require clean Ruff checks
        run: make ruff
      - name: Build source distribution
        run: |
          uv build --sdist --out-dir dist
          uv build --project converters/pff --sdist --out-dir "$GITHUB_WORKSPACE/dist"
      - name: Download tested DMG
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: macos-dmg
          path: dist
      - name: Write checksums
        run: (cd dist && shasum -a 256 *.tar.gz *.dmg > SHA256SUMS)
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          prerelease=()
          metadata="$(make release-tag-check GITHUB_REF_NAME="$RELEASE_TAG")"
          case "$metadata" in
            *"channel=preview"*) prerelease=(--prerelease) ;;
          esac
          gh release create "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$(git rev-parse "$RELEASE_TAG^{commit}")" \
            --title "Email Collection Toolkit $RELEASE_TAG" \
            --generate-notes \
            --draft \
            "${prerelease[@]}" \
            dist/*
      - name: Install verified Sparkle publisher tools
        run: make sparkle-tools
      - name: Verify Sparkle archive signer
        run: make test-sparkle-signing
      - name: Prepare appcast update
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          shopt -s nullglob
          dmgs=(dist/*.dmg)
          test "${#dmgs[@]}" -eq 1
          appcast_path="$RUNNER_TEMP/appcast.xml"
          previous_tag="$(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
            --jq '[.[] | select(.draft == false) | select(any(.assets[]?; .name == "appcast.xml"))][0].tag_name // empty')"
          if [[ -n "$previous_tag" ]]; then
            gh release download "$previous_tag" --repo "$GITHUB_REPOSITORY" \
              --pattern appcast.xml --output "$appcast_path"
          else
            cp website/static/updates/mac/appcast.xml "$appcast_path"
          fi
          test -s "$appcast_path"
          echo "APPCAST=$appcast_path" >> "$GITHUB_ENV"
          echo "ARCHIVE=${dmgs[0]}" >> "$GITHUB_ENV"
          echo "RELEASE_URL=https://github.com/$GITHUB_REPOSITORY/releases/download/$RELEASE_TAG/$(basename "${dmgs[0]}")" >> "$GITHUB_ENV"
      - name: Sign the final notarized DMG's appcast item
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
          SPARKLE_ED25519_PRIVATE_KEY_BASE64: ${{ secrets.SPARKLE_ED25519_PRIVATE_KEY_BASE64 }}
        run: make update-appcast APPCAST="$APPCAST" ARCHIVE="$ARCHIVE" RELEASE_TAG="$RELEASE_TAG" RELEASE_URL="$RELEASE_URL"
      - name: Attach appcast and publish release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          gh release upload "$RELEASE_TAG" "$APPCAST" --repo "$GITHUB_REPOSITORY"
          gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --draft=false
          gh workflow run pages.yml --repo "$GITHUB_REPOSITORY" --ref main

  macos:
    name: Build macOS DMG (optional Developer ID signing)
    runs-on: macos-15
    timeout-minutes: 45
    outputs:
      commit: ${{ steps.release.outputs.commit }}
    steps:
      - name: Checkout release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref_name }}
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      - name: Verify release commit
        id: release
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          git check-ref-format "refs/tags/$RELEASE_TAG"
          test "$(git rev-parse HEAD)" = "$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")"
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Verify annotated tag and project version
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: make release-tag-check GITHUB_REF_NAME="$RELEASE_TAG" ARGS=--require-annotated
      - name: Install dependencies
        run: uv sync --locked --all-groups
      - name: Validate signing policy and keychain cleanup
        # GitHub supplies GITHUB_ACTIONS and RUNNER_ENVIRONMENT to every step:
        # https://docs.github.com/en/actions/reference/workflows-and-actions/variables#default-environment-variables
        run: make test-signing
      - name: Install ClamAV and refresh bundled definitions
        run: |
          brew install clamav
          make freshclam
      - name: Build DMG, list mounted contents, and run headless self-test
        if: ${{ runner.environment == 'github-hosted' }}
        env:
          APPLE_CERTIFICATE_P12_BASE64: ${{ secrets.APPLE_CERTIFICATE_P12_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          APPLE_NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
          APPLE_NOTARY_PRIVATE_KEY_BASE64: ${{ secrets.APPLE_NOTARY_PRIVATE_KEY_BASE64 }}
        # make dmg mounts the new candidate, logs every file/link, then runs its installed self-test.
        run: |
          make dmg ARGS=--log-dmg-contents
          shopt -s nullglob
          dmgs=()
          for candidate in dist/*.dmg; do
            [[ "$candidate" == *_UNSIGNED.dmg ]] || dmgs+=("$candidate")
          done
          test "${#dmgs[@]}" -eq 1
          make notarize-dmg DMG="${dmgs[0]}"
          make test-dmg DMG="${dmgs[0]}"
      - name: Upload tested DMG
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: macos-dmg
          path: dist/*.dmg
          if-no-files-found: error
      - name: Upload packaging evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: macos-packaging-reports
          path: dist/*.json
          if-no-files-found: ignore
