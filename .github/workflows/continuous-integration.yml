# TEMPORARY diagnostic workflow for PR #225 (delete this branch afterwards).

name: Continuous integration

on:
  push:
    branches:
      - "claude/diag-**"

permissions:
  contents: read

jobs:
  imap-ctrl-c:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v10.0.1
      - run: uv sync --locked --all-groups
      - name: IMAP Ctrl-C test, repeated
        run: |
          for i in 1 2 3 4; do
            uv run pytest -q -p no:cacheprovider tests/test_imap.py -k test_cli_ctrl_c_checkpoints -s > out.txt 2>&1 || true
            grep -E "^DIAG|passed|failed" out.txt | grep -v "print(" || true
            sed -n '/DIAGLOG-BEGIN/,/DIAGLOG-END/p' out.txt | cut -c1-400 || true
          done
