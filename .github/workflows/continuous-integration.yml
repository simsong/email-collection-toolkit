name: Continuous integration

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  MAILARCHIVER_NATIVE_GUI_E2E: "0"
  MAILARCHIVER_NATIVE_APPLICATION_E2E: "0"
  MAILARCHIVER_NATIVE_HTML_FIND_E2E: "0"
  MAILARCHIVER_NATIVE_SETUP_E2E: "0"

jobs:
  pytest:
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
      - name: Set up Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.12"
      - name: Set up uv
        uses: astral-sh/setup-uv@v10.0.1
      - name: Install ClamAV and PDF tools
        run: |
          brew install clamav poppler
          scanner_prefix="$(brew --prefix clamav)"
          scanner_runtime="$(mktemp -d /tmp/mct-ci-clamav.XXXXXX)"
          mkdir "$scanner_runtime/database"
          printf '%s\n' \
            "DatabaseDirectory $scanner_runtime/database" \
            'DatabaseMirror database.clamav.net' \
            > "$scanner_runtime/freshclam.conf"
          "$scanner_prefix/bin/freshclam" --config-file="$scanner_runtime/freshclam.conf"
          {
            echo "MAILARCHIVER_CLAMD=$scanner_prefix/sbin/clamd"
            echo "MAILARCHIVER_CLAMDSCAN=$scanner_prefix/bin/clamdscan"
            echo "MAILARCHIVER_CLAMD_CONFIG=$scanner_runtime/clamd.conf"
            echo "MAILARCHIVER_CLAMD_SOCKET=$scanner_runtime/clamd.sock"
          } >> "${GITHUB_ENV}"
          printf '%s\n' \
            "DatabaseDirectory $scanner_runtime/database" \
            "LocalSocket $scanner_runtime/clamd.sock" \
            > "$scanner_runtime/clamd.conf"
      - name: Smoke-test on-demand ClamAV
        shell: bash
        run: |
          "$MAILARCHIVER_CLAMD" --foreground --config-file="$MAILARCHIVER_CLAMD_CONFIG" &
          clamd_pid=$!
          trap 'kill "$clamd_pid" 2>/dev/null || true' EXIT
          for attempt in {1..120}; do
            if [[ -S "$MAILARCHIVER_CLAMD_SOCKET" ]]; then
              break
            fi
            if ! kill -0 "$clamd_pid" 2>/dev/null; then
              wait "$clamd_pid"
              exit 1
            fi
            sleep 1
          done
          test -S "$MAILARCHIVER_CLAMD_SOCKET"
          "$MAILARCHIVER_CLAMDSCAN" --config-file="$MAILARCHIVER_CLAMD_CONFIG" --ping=10
          kill "$clamd_pid"
          wait "$clamd_pid"
          trap - EXIT
          rm -f "$MAILARCHIVER_CLAMD_SOCKET"
      - name: Install dependencies
        run: uv sync --locked --all-groups
      - name: Install headless test browser
        run: make install-test-browser PLAYWRIGHT_INSTALL_ARGS="chromium"
      - name: Archive and Chromium GUI tests
        # Hosted runners include rustup; explicitly provision the check components.
        env:
          RUSTUP_TOOLCHAIN: stable
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt,clippy
          make check
      - name: Upload Playwright failure traces
        if: failure()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: playwright-traces-${{ github.run_id }}-${{ github.run_attempt }}
          path: test-results
          if-no-files-found: ignore
          retention-days: 7

      - name: Validate distributions
        run: make distribution-check
      - name: Install Zola
        env:
          ZOLA_VERSION: 0.23.4
          ZOLA_SHA256_ARM64: 303b8e1f3251a6250e47f811eda143316f653c22201faa66777d48ac499c0ee3
          ZOLA_SHA256_X86_64: e79edcba2e8d03d22065c9cb8fa2e3abf07b823ef17f00abdc060188dceabba7
        run: |
          case "$(uname -m)" in
            arm64) zola_arch=aarch64; zola_sha256="$ZOLA_SHA256_ARM64" ;;
            x86_64) zola_arch=x86_64; zola_sha256="$ZOLA_SHA256_X86_64" ;;
            *) echo 'Unsupported macOS architecture'; exit 1 ;;
          esac
          curl --fail --location --output "$RUNNER_TEMP/zola.tar.gz" \
            "https://github.com/getzola/zola/releases/download/v${ZOLA_VERSION}/zola-v${ZOLA_VERSION}-${zola_arch}-apple-darwin.tar.gz"
          printf '%s  %s\n' "$zola_sha256" "$RUNNER_TEMP/zola.tar.gz" | shasum -a 256 --check -
          mkdir "$RUNNER_TEMP/zola"
          tar -xzf "$RUNNER_TEMP/zola.tar.gz" -C "$RUNNER_TEMP/zola"
          echo "$RUNNER_TEMP/zola" >> "$GITHUB_PATH"
      - name: Build website
        run: make website-build-check
