name: Continuous integration

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  MAILARCHIVER_NATIVE_GUI_E2E: "0"
  MAILARCHIVER_NATIVE_APPLICATION_E2E: "0"
  MAILARCHIVER_NATIVE_HTML_FIND_E2E: "0"
  MAILARCHIVER_NATIVE_SETUP_E2E: "0"

jobs:
  dmg-smoke:
    name: Build and mount unsigned macOS DMG
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
      - name: Set up Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.12"
      - name: Set up uv
        uses: astral-sh/setup-uv@v10.0.1
      - name: Install dependencies and ClamAV
        run: |
          brew install clamav
          uv sync --locked --all-groups
      - name: Refresh project virus definitions
        run: make freshclam
      - name: Build and test mounted DMG without release credentials
        run: make dmg
      - name: Upload mounted-image inventory
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: macos-dmg-smoke-inventory-${{ github.run_id }}-${{ github.run_attempt }}
          path: dist/*.contents.json
          if-no-files-found: ignore
          retention-days: 7

  pytest:
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
      - name: Set up Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.12"
      - name: Set up uv
        uses: astral-sh/setup-uv@v10.0.1
      - name: Install ClamAV and PDF tools
        run: |
          brew install clamav poppler
      - name: Install dependencies
        run: uv sync --locked --all-groups
      - name: Refresh project virus definitions
        run: make freshclam
      - name: Install headless test browser
        run: make install-test-browser PLAYWRIGHT_INSTALL_ARGS="chromium"
      - name: Archive and Chromium GUI tests
        # Hosted runners include rustup; explicitly provision the check components.
        env:
          RUSTUP_TOOLCHAIN: stable
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt,clippy
          make check
      - name: Upload Playwright failure traces
        if: failure()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: playwright-traces-${{ github.run_id }}-${{ github.run_attempt }}
          path: test-results
          if-no-files-found: ignore
          retention-days: 7

      - name: Validate distributions
        run: make distribution-check
      - name: Install Zola
        env:
          ZOLA_VERSION: 0.23.4
          ZOLA_SHA256_ARM64: 303b8e1f3251a6250e47f811eda143316f653c22201faa66777d48ac499c0ee3
          ZOLA_SHA256_X86_64: e79edcba2e8d03d22065c9cb8fa2e3abf07b823ef17f00abdc060188dceabba7
        run: |
          case "$(uname -m)" in
            arm64) zola_arch=aarch64; zola_sha256="$ZOLA_SHA256_ARM64" ;;
            x86_64) zola_arch=x86_64; zola_sha256="$ZOLA_SHA256_X86_64" ;;
            *) echo 'Unsupported macOS architecture'; exit 1 ;;
          esac
          curl --fail --location --output "$RUNNER_TEMP/zola.tar.gz" \
            "https://github.com/getzola/zola/releases/download/v${ZOLA_VERSION}/zola-v${ZOLA_VERSION}-${zola_arch}-apple-darwin.tar.gz"
          printf '%s  %s\n' "$zola_sha256" "$RUNNER_TEMP/zola.tar.gz" | shasum -a 256 --check -
          mkdir "$RUNNER_TEMP/zola"
          tar -xzf "$RUNNER_TEMP/zola.tar.gz" -C "$RUNNER_TEMP/zola"
          echo "$RUNNER_TEMP/zola" >> "$GITHUB_PATH"
      - name: Build website
        run: make website-build-check
