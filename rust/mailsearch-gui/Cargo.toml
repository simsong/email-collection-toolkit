# Experimental read-only desktop archive reader.
# The library owns SQLite queries, verified MBOX reads, and display decoding.
# Binaries connect that library to the existing web UI or an egui comparison.
# Both use the existing archive format without a Python runtime.
# Synthetic fixtures and headless tests share the production read path.
[package]
name = "mailsearch-rust"
version = "0.1.0"
edition = "2021"
rust-version = "1.95"
publish = false
license = "GPL-2.0-only"

[features]
native-smoke = ["dep:block2", "dep:webview2-com", "dep:windows"]

[dependencies]
archive-verifier = { path = "../archive-verifier" }
anyhow = "1.0"
eframe = { version = "0.36.2", default-features = false, features = ["default_fonts", "glow", "x11", "wayland"] }
html2text = "0.17.1"
mailparse = "0.17.0"
rusqlite = { version = "0.37", features = ["bundled", "hooks"] }
sha2 = "0.10.9"
url = "2.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3.23"
chrono = { version = "0.4", default-features = false, features = ["std"] }
base64 = "0.22"
ammonia = "4"
encoding_rs = "0.8"
rfd = "0.15"
arboard = "3.6"
zip = { version = "2.4", default-features = false }

[build-dependencies]
toml = "1.1"

[dev-dependencies]
tempfile = "3.23"
egui_kittest = { version = "0.36.2", default-features = false }

[target.'cfg(any(target_os = "macos", target_os = "windows"))'.dependencies]
wry = "0.57"
tao = "0.37"
muda = { version = "0.20", default-features = false }

[target.'cfg(target_os = "macos")'.dependencies]
dispatch2 = "0.3"
block2 = { version = "0.6", optional = true }
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["NSApplication", "NSBitmapImageRep", "NSImage", "NSImageRep", "NSDragging", "NSDraggingItem", "NSDraggingSession", "NSPasteboard", "NSPasteboardItem", "NSWorkspace", "NSEvent", "NSView", "NSOpenPanel", "NSSavePanel"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["NSData", "NSDictionary", "NSError", "NSArray", "NSString", "NSRunLoop", "NSBundle", "NSProcessInfo", "NSURL"] }
objc2-web-kit = { version = "0.3", default-features = false, features = ["WKSnapshotConfiguration", "WKWebView", "block2"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_Security", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse"] }
open = "5"
libloading = "0.8"
webview2-com = { version = "0.39", optional = true }
windows = { version = "0.62", features = ["Win32_UI_Shell", "Win32_System_Com"], optional = true }
