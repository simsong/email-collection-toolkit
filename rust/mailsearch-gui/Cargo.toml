# Experimental read-only desktop archive reader.
# The library owns SQLite queries, verified MBOX reads, and display decoding.
# Binaries connect that library to the existing web UI or an egui comparison.
# Both use the existing archive format without a Python runtime.
# Synthetic fixtures and headless tests share the production read path.
[package]
name = "mailsearch-rust"
version = "0.1.0"
edition = "2021"
rust-version = "1.95"
publish = false
license = "GPL-2.0-only"

[features]
native-smoke = ["dep:block2", "dep:objc2", "dep:objc2-app-kit", "dep:objc2-foundation", "dep:objc2-web-kit"]

[dependencies]
anyhow = "1.0"
eframe = { version = "0.36.2", default-features = false, features = ["default_fonts", "glow", "x11", "wayland"] }
html2text = "0.17.1"
mailparse = "0.17.0"
rusqlite = { version = "0.37", features = ["bundled", "hooks"] }
sha2 = "0.10.9"
url = "2.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3.23"
egui_kittest = { version = "0.36.2", default-features = false }

[target.'cfg(target_os = "macos")'.dependencies]
wry = "0.57"
tao = "0.37"
block2 = { version = "0.6", optional = true }
objc2 = { version = "0.6", optional = true }
objc2-app-kit = { version = "0.3", default-features = false, features = ["NSBitmapImageRep", "NSImage", "NSImageRep"], optional = true }
objc2-foundation = { version = "0.3", default-features = false, features = ["NSData", "NSDictionary", "NSError"], optional = true }
objc2-web-kit = { version = "0.3", default-features = false, features = ["WKSnapshotConfiguration", "WKWebView", "block2"], optional = true }
