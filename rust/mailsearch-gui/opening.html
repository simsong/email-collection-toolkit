<!-- Gate the Rust reader behind foreground database validation and recovery.
     This page contains no archive actions or message content before opening.
     Its worker reports recovery, completion and failures over the private IPC.
     An elapsed counter measures time spent recovering without claiming progress.
     Abort leaves the archive unopened; Close exits a failed or aborted attempt.
     SQLite owns its journals throughout; the page never accesses archive files. -->
<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Opening archive</title>
<style>
body { font: 17px system-ui; color: CanvasText; background: Canvas; margin: 0; }
main { max-width: 36rem; margin: 15vh auto; padding: 2rem; }
button { font: inherit; padding: .5rem 1.2rem; margin-top: 1rem; }
#detail { white-space: pre-wrap; overflow-wrap: anywhere; }
</style><script src="opening.js" defer></script></head>
<body><main aria-labelledby="heading"><h1 id="heading">Opening archive…</h1>
<p id="status" role="status">Checking the archive databases.</p>
<p id="elapsed" hidden></p><p id="detail" role="alert"></p>
<button id="abort" type="button">Abort</button><button id="close" type="button" hidden>Close</button>
</main></body></html>
